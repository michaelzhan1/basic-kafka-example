name: log-handler
services:
  # database
  timescaledb:
    image: timescale/timescaledb:latest-pg17
    ports:
      - 5432:5432
    volumes:
      - ./scripts:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: logs_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:latest
    depends_on:
      timescaledb:
        condition: service_healthy
    ports:
      - 6432:6432
    environment:
      DB_USER: postgres
      DB_PASSWORD: password
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAMES: logs_db
      LISTEN_ADDR: 0.0.0.0
      LISTEN_PORT: 6432
      AUTH_TYPE: plain
      AUTH_FILE: /etc/pgbouncer/userlist.txt
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 20
    volumes:
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432 -d pgbouncer"]
      interval: 5s
      timeout: 5s
      retries: 10

  # kafka
  kafka:
    image: apache/kafka:latest
    ports:
      - 9092:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # Listen on all interfaces for internal traffic and controller traffic
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093

      # Tell clients (like your producer/consumer) to connect via the hostname 'kafka'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # for development, we can set replication factors to 1 since we only have one broker
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  kafka-init:
    image: apache/kafka:latest
    depends_on:
      kafka:
        condition: service_healthy
    command: [
      "/opt/kafka/bin/kafka-topics.sh",
      "--create",
      "--bootstrap-server", "kafka:9092",
      "--topic", "hello-world",
      "--partitions", "3",
      "--replication-factor", "1",
      "--if-not-exists",
    ]

  # services
  producer:
    build:
      context: .
      dockerfile: Dockerfile
      target: producer
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  consumer:
    build:
      context: .
      dockerfile: Dockerfile
      target: consumer
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
  
  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
